[project]
name = "shikigami-core"
version = "0.1.0"
description = "A tiny autonomous robot companion. Same code on Mac (sim backend) and Raspberry Pi (pidog/picrawler backends)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.35",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Mac sim HAL (face/mic/speaker). Harmless on the Pi until a native HAL replaces them.
    "numpy>=1.26",
    "opencv-python>=4.9,<5",
    "sounddevice>=0.5",
    "pillow>=10.0",
    "pygame>=2.5",
    "pyside6-essentials>=6.6",  # sim dashboard (Qt)
    "pipecat-ai>=1.16,<1.17",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
shikigami = "shikigami.__main__:main"
sim = "shikigami.__main__:main_sim"
eyes-demo = "shikigami.expression.eyes.demo:main"
eyes-bench = "shikigami.expression.eyes.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shikigami"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
