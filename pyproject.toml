[project]
name = "shikigami-core"
version = "0.1.0"
description = "A tiny autonomous robot companion. Same code on Mac (sim backend) and Raspberry Pi (pidog/picrawler backends)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.35",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

# Heavy / machine-specific deps live only in the `sim` extra (macOS dev machine).
# The Pi backends need SunFounder libs, installed on the Pi itself, never here.
[project.optional-dependencies]
sim = [
    "numpy>=1.26",
    "opencv-python>=4.9,<5",  # OpenCV 5.x moved/removed CascadeClassifier; we target the 4.x API
    "sounddevice>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
shikigami = "shikigami.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shikigami"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
